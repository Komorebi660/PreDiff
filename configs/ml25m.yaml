_defaults:
  learning_steps: 350000
  batch_size: 1024
  lr: 0.001
  weight_decay: 0.0
  eval_epochs: 0.5
  log_interval: 100
  patience: 5
prediff:
  hidden_dim: 128
  num_encoder_layers: 4
  num_attention_heads: 2
  dropout_prob: 0.2
  diffusion_steps: 32
  noise_schedule: linear
  decoder_layers: 4
  dist_dropout: 0.95
  corr_alpha: 0.8
  corr_tau: 0.5
